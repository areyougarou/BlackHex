name: CI

# Builds the library and runs its tests on every push and PR.
# On a version tag (v*) it also (a) proves a stranger can consume the tag from JitPack,
# and (b) publishes supply-chain proof as release assets: SHA-256 checksums of the AAR
# and .so files GOOGLE PLAY ADOPTERS ACTUALLY DOWNLOAD FROM JITPACK, plus a CycloneDX SBOM
# that the build job writes from the Gradle dependency graph (every library the AAR pulls in).
#
# Why hash the JitPack artifact and not a CI rebuild: JitPack builds from source on its own
# machines, and the native (.so) build is not guaranteed byte-reproducible, so a hash of a
# CI-local rebuild could differ from what adopters fetch. We hash the JitPack output instead.
#
# To redo the tag jobs for a tag that already exists, without moving the tag: run this
# workflow by hand on main (Actions > CI > Run workflow) and enter the tag, e.g. v0.2.1.
#
# SUPPLY-CHAIN NOTE: pin every `uses:` below to a full commit SHA before you rely on these
# assets for integrity. Version tags (shown here) are mutable.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to check on JitPack and release, for example v0.2.1"
        required: true

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build library and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}   # empty except on a manual run, so a push builds its own commit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # the default list also asks for "tools", which the SDK no longer has
      - name: Install the pinned NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the release AAR, run unit tests and write the SBOM
        # Tags up to v0.2.1 store gradlew without the execute bit, and a manual run builds the
        # tag itself, so run it through bash.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash ./gradlew --no-daemon :sdk:assembleRelease :sdk:test :sdk:cyclonedxDirectBom -PreleaseTag="$RELEASE_TAG"
      - name: Keep the AAR as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intakto-aar-${{ github.sha }}
          path: sdk/build/outputs/aar/sdk-release.aar
          if-no-files-found: error
      - name: Keep the SBOM for the release job
        uses: actions/upload-artifact@v4
        with:
          name: intakto-sbom
          path: sdk/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: error

  adoption-check:
    name: A stranger consumes the tag from JitPack
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools   # the default list also asks for "tools", which the SDK no longer has
      - name: Build a fresh one-line consumer against the tag
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG}"
          mkdir -p consumer/app/src/main/java/com/example/adopt
          cd consumer
          cat > settings.gradle.kts <<EOF
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }
          }
          rootProject.name = "adopt"
          include(":app")
          EOF
          cat > build.gradle.kts <<EOF
          plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<EOF
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.example.adopt"; compileSdk = 35
            defaultConfig { applicationId = "com.example.adopt"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("com.github.areyougarou:IntaktoFT:${VER}") }
          EOF
          cat > app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name=".App" android:label="adopt" />
          </manifest>
          EOF
          cat > app/src/main/java/com/example/adopt/App.kt <<EOF
          package com.example.adopt
          import android.app.Application
          import io.github.areyougarou.intakto.Intakto
          class App : Application() { override fun onCreate() { super.onCreate(); Intakto.check(this) } }
          EOF
          gradle wrapper --gradle-version 8.7
          # First resolve triggers JitPack's build of the tag; retry while it builds.
          for i in $(seq 1 20); do
            if ./gradlew --no-daemon :app:assembleDebug; then echo "adoption OK"; exit 0; fi
            echo "retry $i: JitPack may still be building ${VER}"; sleep 45
          done
          echo "JitPack did not serve ${VER} in time"; exit 1

  release-assets:
    name: Hash the JitPack artifact and publish the SBOM
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: adoption-check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach assets to the release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit (for its release notes file)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Make sure the release notes file for this tag exists
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes file $NOTES is missing. Add it before tagging ${TAG}, or the release would publish with an empty body."
            exit 1
          fi
          echo "found release notes: $NOTES"
      - name: Download the AAR JitPack serves to adopters
        shell: bash
        run: |
          set -euo pipefail
          VER="${TAG}"
          BASE="https://jitpack.io/com/github/areyougarou/IntaktoFT/${VER}"
          AAR="IntaktoFT-${VER}.aar"
          # Touch the build log first so JitPack starts building, then poll for the AAR.
          curl -fsSL "${BASE}/build.log" -o build.log || true
          for i in $(seq 1 30); do
            code=$(curl -s -o "${AAR}" -w "%{http_code}" "${BASE}/${AAR}")
            if [ "$code" = "200" ] && unzip -t "${AAR}" >/dev/null 2>&1; then
              echo "got ${AAR} from JitPack"; break
            fi
            echo "wait $i: JitPack build status ${code}"; sleep 30
            if [ "$i" = "30" ]; then echo "JitPack did not serve ${AAR}"; exit 1; fi
          done
          echo "AAR=${AAR}" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"
      - name: SHA-256 of the JitPack AAR and every bundled .so
        shell: bash
        run: |
          set -euo pipefail
          sumfile="SHA256SUMS-${VER}.txt"
          {
            echo "# SHA-256 of the IntaktoFT ${VER} artifact as JitPack serves it at release time."
            echo "# AAR URL: https://jitpack.io/com/github/areyougarou/IntaktoFT/${VER}/${AAR}"
            echo "# These hash what an adopter downloads from JitPack, not a CI rebuild."
            sha256sum "${AAR}"
          } > "${sumfile}"
          mkdir -p aar_x && (cd aar_x && unzip -q "../${AAR}")
          ( cd aar_x && find jni -name '*.so' -print0 | sort -z | xargs -0 sha256sum ) >> "${sumfile}"
          cat "${sumfile}"
          echo "SUMFILE=${sumfile}" >> "$GITHUB_ENV"
      - name: Fetch the SBOM the build job wrote from the dependency graph
        uses: actions/download-artifact@v4
        with:
          name: intakto-sbom
          path: sbom
      - name: Name the SBOM for the release, and refuse one that lists no components
        shell: bash
        run: |
          set -euo pipefail
          n=$(jq '.components | length' sbom/bom.json)
          if [ "$n" -lt 1 ]; then echo "::error::The SBOM lists no components; not publishing it."; exit 1; fi
          echo "SBOM lists $n components"
          mv sbom/bom.json "intakto-${VER}.cdx.json"
      - name: Create the release with its notes, checksums and SBOM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: docs/release-notes/${{ env.TAG }}.md
          files: |
            ${{ env.SUMFILE }}
            intakto-${{ env.VER }}.cdx.json
