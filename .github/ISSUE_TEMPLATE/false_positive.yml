name: Report a false positive
description: IntaktoFT flagged or closed your app on a phone with no attack tool running.
title: "[false positive] <CHECK_ID> on <phone model>"
labels: ["false-positive"]
body:
  - type: input
    id: phone
    attributes:
      label: Phone model
      description: The model name, and the build fingerprint if you have it (`adb shell getprop ro.build.fingerprint`).
      placeholder: "Pixel 7a / google/lynx/lynx:16/..."
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and build
      description: "For example: Android 16, build BP2A.250805.005."
    validations:
      required: true
  - type: dropdown
    id: check
    attributes:
      label: Which check flagged
      description: The `id` of the signal that read DETECTED. Pick "Other" if it isn't listed.
      options:
        - TAMPER_APK_CONTENT
        - TAMPER_SIGNING_BLOCK
        - TAMPER_REPACKAGER
        - TAMPER_PUBLIC_KEY
        - CLV_PKGNAME_MISMATCH
        - FRIDA_AGENT_IN_MEMORY
        - DISGUISED_LIBRARY_IN_MEMORY
        - OPCODE_TRAMPOLINE
        - HOOK_BYTES
        - GOT_PLT_INTEGRITY
        - UPROBE_RESIDUE
        - LIB_FROM_ROOT_PATH
        - Other (name it in the report below)
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: Paste the whole report, or the `IKFT` line from logcat. We can't fix it without this.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was the app installed
      options:
        - Google Play (internal, closed, open or production track)
        - Sideload with adb install
        - Split install (bundletool / install-multiple)
        - Other (describe below)
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: IntaktoFT version
      description: The JitPack tag in your build file, for example v0.2.1.
      placeholder: "v0.2.1"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: What the app was doing, any other security or debugging SDKs in it, and whether it happens every time.
    validations:
      required: false
  - type: checkboxes
    id: confirms
    attributes:
      label: Before you file
      options:
        - label: I'm on the latest IntaktoFT version, and it still happens.
          required: true
        - label: "No attack tool was running on the phone: no Frida, Xposed or LSPosed, LSPatch, or modified copy of the app."
          required: true
